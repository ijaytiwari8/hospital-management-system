<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | MediCare Hospital</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #eaf4ff, #f8fbff, #e9f3ff);
            overflow: hidden;
        }

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .circle-one {
            width: 300px;
            height: 300px;
            background: rgba(13, 110, 253, 0.09);
            top: -100px;
            left: -80px;
        }

        .circle-two {
            width: 350px;
            height: 350px;
            background: rgba(32, 201, 151, 0.09);
            bottom: -130px;
            right: -100px;
            animation-delay: 2s;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 38px 35px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(220, 232, 245, 0.9);
            border-radius: 23px;
            box-shadow: 0 18px 55px rgba(30, 70, 120, 0.12);
            animation: fadeUp 0.8s ease;
            backdrop-filter: blur(12px);
        }

        .logo {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: linear-gradient(135deg, #0878e8, #0753b8);
            color: white;
            font-size: 31px;
            box-shadow: 0 9px 22px rgba(13, 110, 253, 0.25);
        }

        h2 {
            text-align: center;
            color: #123b70;
            font-size: 25px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #8795a7;
            font-size: 13px;
            margin-top: 7px;
            margin-bottom: 28px;
        }

        .message {
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 9px;
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #ffd5d5;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            animation: fadeUp 0.4s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344b66;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 14px 45px;
            background: #f8fbff;
            border: 1px solid #dce6f1;
            border-radius: 11px;
            outline: none;
            color: #263d58;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s ease;
        }

        input:focus {
            background: white;
            border-color: #1682ed;
            box-shadow: 0 0 0 4px rgba(22, 130, 237, 0.10);
        }

        input::placeholder {
            color: #a5b2c2;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
            padding: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #0878e8, #0753b8);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(13, 110, 253, 0.22);
            transition: 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 25px rgba(13, 110, 253, 0.30);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1768bd;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .back:hover {
            color: #084298;
            transform: translateX(-3px);
        }

        .footer {
            text-align: center;
            color: #a0adbb;
            font-size: 11px;
            margin-top: 25px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-22px);
            }
        }

        @media(max-width: 480px) {
            .login-box {
                padding: 30px 22px;
            }

            h2 {
                font-size: 22px;
            }
        }

        @media(prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="bg-circle circle-one"></div>
    <div class="bg-circle circle-two"></div>

    <div class="login-box">

        <div class="logo">✚</div>

        <h2>Doctor Login</h2>

        <p class="subtitle">
            Welcome back! Login to your doctor account.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">⚠ {{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('doctor_login') }}">

            <div class="form-group">

                <label>Email Address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <button type="submit" class="login-btn">
                Login to Dashboard →
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

        <div class="footer">
            © 2026 MediCare Hospital Management System
        </div>

    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        toggleButton.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "🙈";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "👁️";
                toggleButton.setAttribute("aria-label", "Show password");
            }

        });
    </script>

</body>
</html>
