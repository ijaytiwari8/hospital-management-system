<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor | MediCare Hospital</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #f8fbff, #e9f3ff);
            padding: 35px 20px;
            overflow-x: hidden;
        }

        .background-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
            animation: float 7s ease-in-out infinite;
        }

        .circle-one {
            width: 250px;
            height: 250px;
            background: rgba(13, 110, 253, 0.08);
            top: -70px;
            left: -70px;
        }

        .circle-two {
            width: 300px;
            height: 300px;
            background: rgba(32, 201, 151, 0.08);
            bottom: -100px;
            right: -80px;
            animation-delay: 2s;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
            animation: slideDown 0.7s ease;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #0878e8, #0753b8);
            color: white;
            font-size: 28px;
            border-radius: 17px;
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
            margin-bottom: 13px;
        }

        .page-header h1 {
            color: #12345a;
            font-size: 29px;
            font-weight: 800;
        }

        .page-header p {
            color: #718096;
            font-size: 14px;
            margin-top: 7px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 22px;
            border: 1px solid rgba(220, 232, 245, 0.9);
            box-shadow: 0 15px 45px rgba(30, 70, 120, 0.10);
            animation: fadeUp 0.8s ease;
        }

        .form-heading {
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid #edf2f7;
        }

        .form-heading h2 {
            color: #173b63;
            font-size: 20px;
            font-weight: 800;
        }

        .form-heading p {
            color: #8795a7;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344b66;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #f8fbff;
            border: 1px solid #dce6f1;
            border-radius: 11px;
            outline: none;
            color: #263d58;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s ease;
        }

        input:focus {
            background: white;
            border-color: #1682ed;
            box-shadow: 0 0 0 4px rgba(22, 130, 237, 0.10);
        }

        input::placeholder {
            color: #a5b2c2;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #0878e8, #0753b8);
            color: white;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: 0.3s ease;
            box-shadow: 0 7px 18px rgba(13, 110, 253, 0.20);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 23px rgba(13, 110, 253, 0.30);
        }

        .back {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px;
            background: #edf4fc;
            color: #1768bd;
            border-radius: 11px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .back:hover {
            background: #dcecff;
            transform: translateY(-3px);
        }

        .footer-text {
            text-align: center;
            color: #9aa8b8;
            font-size: 12px;
            margin-top: 24px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .container {
                padding: 24px 19px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <div class="page-header">
        <div class="logo">✚</div>
        <h1>MediCare Hospital</h1>
        <p>Manage your healthcare professionals</p>
    </div>

    <div class="container">

        <div class="form-heading">
            <h2>✏️ Edit Doctor Details</h2>
            <p>Update the doctor's information below.</p>
        </div>

        <form method="POST">

            <div class="form-group">
                <label>Doctor Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">👨‍⚕️</span>
                    <input type="text"
                           name="name"
                           value="{{ doctor.name }}"
                           placeholder="Enter doctor name"
                           required>
                </div>
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <div class="input-wrapper">
                    <span class="input-icon">🩺</span>
                    <input type="text"
                           name="specialization"
                           value="{{ doctor.specialization or '' }}"
                           placeholder="e.g. Cardiologist">
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <span class="input-icon">📞</span>
                    <input type="text"
                           name="phone"
                           value="{{ doctor.phone or '' }}"
                           placeholder="Enter phone number">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email"
                           name="email"
                           value="{{ doctor.email or '' }}"
                           placeholder="Enter email address">
                </div>
            </div>

            <div class="form-group">
                <label>Available Days</label>
                <div class="input-wrapper">
                    <span class="input-icon">📅</span>
                    <input type="text"
                           name="available_days"
                           value="{{ doctor.available_days or '' }}"
                           placeholder="e.g. Monday, Wednesday, Friday">
                </div>
            </div>

            <div class="button-group">
                <button type="submit">✓ Update Doctor</button>

                <a href="{{ url_for('doctors_list') }}" class="back">
                    ← Back to List
                </a>
            </div>

        </form>

        <div class="footer-text">
            © 2026 MediCare Hospital Management System
        </div>

    </div>

</body>
</html>
